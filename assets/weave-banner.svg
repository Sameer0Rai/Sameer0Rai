<svg width="100%" viewBox="0 0 1600 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120a1f"/>
      <stop offset="55%" stop-color="#2b0a3d"/>
      <stop offset="100%" stop-color="#3d0f4a"/>
    </linearGradient>
    <clipPath id="swoosh">
      <path d="M0,0 H1600 V210 C1250,270 950,150 650,190 C400,225 180,175 0,235 Z"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <g clip-path="url(#swoosh)">
    <rect width="1600" height="260" fill="url(#bgGrad)"/>

    <!-- woven threads -->
    <path d="M -50,190 C 250,60 480,260 760,130 S 1200,40 1650,150" fill="none" stroke="#7209B7" stroke-width="4" opacity="0.55" stroke-linecap="round" filter="url(#soft)">
      <animate attributeName="stroke-dashoffset" from="0" to="-760" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="26 18" dur="9s" repeatCount="indefinite"/>
    </path>

    <path d="M -50,235 C 220,330 520,70 800,210 S 1260,320 1650,190" fill="none" stroke="#F72585" stroke-width="4.5" opacity="0.65" stroke-linecap="round" filter="url(#soft)">
      <animate attributeName="stroke-dashoffset" from="0" to="820" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="22 20" dur="7.5s" repeatCount="indefinite"/>
    </path>

    <path d="M -50,90 C 320,190 600,-10 880,110 S 1320,230 1650,70" fill="none" stroke="#C77DFF" stroke-width="2.5" opacity="0.5" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-680" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="18 22" dur="11s" repeatCount="indefinite"/>
    </path>

    <path d="M -50,270 C 300,150 660,330 940,195 S 1360,90 1650,235" fill="none" stroke="#4CC9F0" stroke-width="2" opacity="0.4" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="700" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="14 16" dur="13s" repeatCount="indefinite"/>
    </path>

    <path d="M -50,150 C 260,40 540,220 820,95 S 1280,10 1650,120" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.28" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-600" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="10 26" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="800" y="140" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif" font-size="52" font-weight="700" fill="#ffffff">Hi There! I'm Sameer 👋</text>
</svg>
